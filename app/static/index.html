<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sona AI - Stock Analyser</title>

    <!-- Error Handler -->
    <script>
        window.onerror = function (msg, url, line, col, error) {
            const div = document.createElement('div');
            div.style.position = 'fixed';
            div.style.top = '0';
            div.style.left = '0';
            div.style.width = '100%';
            div.style.backgroundColor = '#EF4444';
            div.style.color = 'white';
            div.style.padding = '20px';
            div.style.zIndex = '9999';
            div.innerHTML = '<h3>Application Error</h3><pre>' + msg + '\n' + url + ':' + line + '</pre>';
            document.body.appendChild(div);
            return false;
        };
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        secondary: '#1E293B',
                        accent: '#38BDF8',
                        success: '#10B981',
                        danger: '#EF4444',
                        warning: '#F59E0B',
                    }

                }
            }
        }
    </script>

    <!-- Apple SF Pro Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/style.css">

    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f1419;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            color: #fff;
        }

        .glass-card {
            background: rgba(20, 25, 35, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .glass-card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .glass-card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15);
        }

        .purple-gradient {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .dark-card {
            background: rgba(25, 30, 40, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-modern {
            background: rgba(25, 30, 40, 0.8);
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .input-modern:focus {
            background: rgba(25, 30, 40, 1);
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .btn-purple {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.25);
        }

        .btn-purple:hover {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.35);
        }

        .btn-purple:active {
            transform: translateY(0);
        }

        .btn-dark {
            background: rgba(30, 35, 45, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .btn-dark:hover {
            background: rgba(40, 45, 60, 1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.4s ease forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-in {
            animation: slideIn 0.3s ease forwards;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .pulse {
            animation: pulse 2s ease infinite;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.6);
        }

        /* Performance optimizations */
        button,
        input,
        a {
            transition: all 0.2s ease;
            will-change: transform;
        }

        .chart-container {
            background: rgba(15, 20, 30, 0.8);
            border-radius: 20px;
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-primary text-white min-h-screen font-sans antialiased selection:bg-accent selection:text-white">
    <div id="root"></div>

    <!-- Main App Script -->
    <script type="text/babel" src="/static/app.js?v=21.2"></script>
</body>

</html>
